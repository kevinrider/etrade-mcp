name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'uv>=0.9,<1'
      - run: uv lock --check
      - run: uv sync --python '${{ matrix.python }}' --extra dev --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pyright --pythonpath .venv/bin/python
      - run: uv build --clear
      - run: uv run --frozen python -m twine check --strict dist/*
      - run: uv run --frozen python scripts/check_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error

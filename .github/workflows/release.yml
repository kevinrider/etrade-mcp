name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'uv>=0.9,<1'
      - run: python scripts/check_release.py
      - run: uv lock --check
      - run: uv sync --python '${{ matrix.python }}' --extra dev --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pyright --pythonpath .venv/bin/python
      - run: uv run --frozen pytest -n 4 -W error

  build:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.distributions.outputs.artifact-id }}
    env:
      UV_PYTHON: "3.12"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install 'uv>=0.9,<1'
      - run: python scripts/check_release.py
      - run: uv lock --check
      - run: uv sync --python 3.12 --extra dev --extra docs --frozen
      - run: uv run --frozen mkdocs build --strict
      - run: uv build --clear
      - run: uv run --frozen python -m twine check --strict dist/*
      - run: uv run --frozen python scripts/check_artifacts.py
      - uses: actions/upload-artifact@v7
        id: distributions
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/etrade-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

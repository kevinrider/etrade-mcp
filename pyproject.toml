[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "etrade-mcp"
dynamic = ["version"]
description = "An unofficial Python MCP adapter for the etrade-python E*TRADE client"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "etrade-mcp contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "etrade-python>=1.1,<2",
  "mcp>=2.3,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.7,<3",
  "typer>=0.20,<1",
  "starlette>=1.10,<2",
  "uvicorn>=0.31.1,<1",
]

[project.urls]
Homepage = "https://github.com/kevinrider/etrade-mcp"
Documentation = "https://github.com/kevinrider/etrade-mcp/blob/main/README.md"
Repository = "https://github.com/kevinrider/etrade-mcp"
Issues = "https://github.com/kevinrider/etrade-mcp/issues"
Changelog = "https://github.com/kevinrider/etrade-mcp/blob/main/CHANGELOG.md"

[project.scripts]
etrade-mcp = "etrade_mcp.cli:app"

[project.optional-dependencies]
dev = [
  "ruff>=0.11,<1",
  "pyright>=1.1.400,<2",
  "build>=1.2,<2",
  "twine>=6,<7",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "pytest-xdist>=3.8,<4",
  "httpx>=0.28,<1",
  "httpx2>=2.10,<3",
]

[tool.hatch.version]
path = "src/etrade_mcp/_version.py"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/etrade_mcp"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "/src", "/scripts", "/tests", "/README.md", "/LICENSE",
  "/CONTRIBUTING.md", "/Makefile", "/pyproject.toml",
  "/uv.lock", "/CHANGELOG.md", "/SECURITY.md", "/CLIENTS.md",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --cov=etrade_mcp --cov-branch --cov-report=term-missing --cov-fail-under=90"
